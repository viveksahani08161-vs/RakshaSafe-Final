<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:605px;background:#FFFFFF;" width="790px" height="605px" viewBox="0 0 790 605" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="564.094" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="541.112">http://www.plantuml.com/plantuml/png/fLPRR-9657xthpZY8Ssga0kvgkgkrk...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="561.75">http://www.plantuml.com/plantuml/png/~1fLPRR-9657xthpZY8Ssga0kvgkgkrk...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="685.713">fLPRR-9657xthpZY8Ssga0kvgkgkrk096ONOo3Q9KbbQpTe3J6DcsB61qgh_lMTyYUscVLWj3y6UxplN</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="705.202">xvmXdxESwNoxJgsVuECFVD0SVFiXkBS3-ux009mx1wRaYKnX2CVK7LE7k24ysguz8O_cqI6XJQSVa3ew</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="701.511">UlxHw2kHS8Y5ZbDkPQz2RfXcQrWhgUALLciEkTwsaMp54hKNSWaBbcPjHFCuPtAPSlZB0XYn-7MYrLOc</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="684.756">OvKg3SyhaNDphdJ2TNasIf5a_TtsdYlDbes7vNTxO36w-6vxgpJhZMb8VoCkdC8y87uFM5Oyr33stvyG</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="680.613">T_m2FWbcdkjKdBUtccWxZzIbGUZReLTIYXFBgWliEKEejIrmwepQ87j3OJvpx92Kf7c7TGLs4D29-rWx</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="681.058">iJlmfSbhF2SG4lknmCCEVjugiWFSWEk5z8wExP1wRa5maM0r2lU69-UH7Fi4Cujafv3PyBnB74RooPvI</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="657.515">fw0U0N5zEhwlgCCkzIAIC-87sBXtJY-wpCj81g4TpeD8Fdl-mztKUww8brtYLIIzPnUTtjCP764gDA0Z</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="674.522">EgNXIyM_wlAl8-dJuC5qbWJ189B5oeK-dKogNis6rrsJcqZUOygU_uAsPEpv3dKd5VMcIxsDP2DP9AVK</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="681.393">VMYujvqEsnIAH52Y9pekzRUfXVi-A3yGQyvo3XkMh-epooYABv-C3F0Bz08lmCNyjkLP3iVvOSFx4AFH</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="671.932">Kkb3Fv89ps8jDhbGiW-fGWIVFlGiOrmw6HedckqnoY5LB37Oi8r9fTSi5NzY7YibqVqEtnAJ5vVRTOP1</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="684.742">y8jh4KEiSF64D9366ddMnyn-nu8ZkL1woHFSVfPlizDjnZLDJkjysY4lJCWwGWBubnduee1nXG