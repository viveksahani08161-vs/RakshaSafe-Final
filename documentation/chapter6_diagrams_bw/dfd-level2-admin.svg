<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:588px;background:#FFFFFF;" width="790px" height="588px" viewBox="0 0 790 588" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="547.797" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="542.24">http://www.plantuml.com/plantuml/png/fLPTRzis57tNhxZmGzTkYxtuAtQnRf...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="562.878">http://www.plantuml.com/plantuml/png/~1fLPTRzis57tNhxZmGzTkYxtuAtQnRf...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="681.468">fLPTRzis57tNhxZmGzTkYxtuAtQnRfKbsT6Mo8Oa9okW5rQYRQ8IvL5qis3TVnyfMX7fsWz53IGmT0xl</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="662.771">FJptaFBxYYF63qLk_G3llkCZbaDe_ndTsf4zz-0AtBaBTzw3TmTzU6sxztu0hXtTpfPswC8h2BtLCeoZ</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="692.446">Du8vU_NulSrt9CEG4fRcsAe-4Rf731LGbBHCTwmiC71sq95gXxBoYT0jR51UwGZ3AKTqcsFurmAOeVJJ</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="688.447">WfK7cZbbNZ9ut16EvVEIPPYfPxDSaAp_zEgyP6ZRLjX-SmMKYXBVlDvIopgrstuKXtQy33k0AgYVM5OZ</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="734.938">hEDUmpho5BPsPnhG1pzmVDSBuXhq3N00thqNBhp0-G3ECeXjHx4SWpKKmusSjGUnPz_NU6pWOvZRZd_d</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="691.701">nnzgS6w0Dn0iOt_kEtRiBuEQ41Y42Qo3Ec8gGMeBeK6PwfW9NV-Yl82xvQ9nPcPPxTGxq-vrGkt58lGM</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="694.6">Tkmbz2MqDNqrlJR9_OHA9nDwRmVsGjXpD6urxPl4GKARRPyX3qpoCA7Il3F4eKaS9RIPLqAN3ruO-OlR</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="657.549">XZiokUE4AbyIAaReXQt3g-dOfDwqLE-l5ojNqnkJDX5EhLq_bcuczC7t7e-PMaqdbZZJL-e36Qfs7ql4</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="705.291">ikQ9fOPmTVMRT1JUGcVXnT13Uz93MK5exsL5nv84IHGvbSHKd0KEXmgpgiLy7VluB4uWueSAUh1df6I4</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="707.007">FxVKMAToZ0gjp5p7DYWbEU44QuH09z2Iamr94ISbrJWoZ9fGMg4D5jVAlcHSOydSIPRm4mkQEBdaSwrJ</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="674.146">EVEhSEte3Dfk6TuYZZFu8n83quqj41MvBcI5SyxsppXREmUlAunOkliPzcBz6ochhviidX9Qj_px