<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:556px;background:#FFFFFF;" width="790px" height="556px" viewBox="0 0 790 556" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="515.203" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="546.772">http://www.plantuml.com/plantuml/png/fLPTQzj857tNhxZu8UjGqYGsnALqbo...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="567.41">http://www.plantuml.com/plantuml/png/~1fLPTQzj857tNhxZu8UjGqYGsnALqbo...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="681.16">fLPTQzj857tNhxZu8UjGqYGsnALqbohos1dgIaQI4xeObbbvx0oHPyH8JWXb__kUaPHOohBBblh1bdJE</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="648.197">_JvtvCzb9MnrsEVUB_JhJtnWJh7_9Rdn4t_6w8ocioajs2rRq8Y6OPJo6G_yb4TXGYVaSufvykKKlEkJ</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="667.468">kvyDVQysaZ9birnwvOFIXR1YJtkZJNPlpLvIPGzTfBmN6_Eaz8ws8Y-xY9LP9VGkb_JT8xeMsSFSceFU</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="667.249">12OtbkxkLINTSsCtqZRFhdEGlB-wtYjZnUxeOVV37aG65pzixpLcWu2d_7SMqZcj4XOFI9JrnGlClh9u</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="704.225">piBW6yKiMKRXjEMythqGawy9pVsKtVdVQWBkZpvylg1b7Dto5_FwaUUz53-OZeY70U0mhN4-lUw04-eg</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="704.84">eYQ4FSAOZda6KPZwGUCcwB4kEoNsW0-q2ciTncmPnOtfAkvHhcZc1tp1qwQw6K3lEFx1rVlBjGvYXWQi</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="655.539">zJ-INLvTziaZa6_yC6IBjPxoPEcdmKtB7FMPuxLEKZzT9MiTio2AforjtALDwkZHOi62TAsHQ1h5IKES</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="681.235">NFQ9Y9p03QEJjQxthQMD-hIn2vUkuj3nbYnEU9Asp76ly7Or2OszvG6hEJxtiADdpOUqgTHMPQ9IHjCs</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="670.428">DqylY8SXu_etrnxwI0EbCsochaW-uhjSws5cfQZa1jh4iLCTolVPFSBApUd02_gsXLLxOPyfCxg2waeQ</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="704.908">EZsUazmBbOE-wjFDavQMtc61oy9ex0QfJJdm7EfO49TZyH1LfVq2K3gMwKZ5m1pL9QPbJeLupeq0xZd0</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="707.889">4LmU7vlr6Aej5TOyAXSGcMxLxc3hQXpQyRQHkNgKA0VHf2ggmQktPfL0gGlx3uyDyN_vX9YQ5hP-