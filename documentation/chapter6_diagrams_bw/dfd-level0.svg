<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:491px;background:#FFFFFF;" width="790px" height="491px" viewBox="0 0 790 491" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="450.016" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="555.707">http://www.plantuml.com/plantuml/png/fLLTRzem57tthxZAmmPQKTbhjKqr96...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="576.345">http://www.plantuml.com/plantuml/png/~1fLLTRzem57tthxZAmmPQKTbhjKqr96...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="705.893">fLLTRzem57tthxZAmmPQKTbhjKqr96LHWQ0ae-l4YviOiEhOp7RweMd_VTV90kbBfQeynVUUUyxz59VM</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="708.688">CUFgIfAFyFKTFmo7b5vdtsb6ho8OGNWLmZnQHtCOms2QBFFePmvXJ6SfNGm10PCFD-_Lt8kIGo5C8Jcn</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="690.43">zq8Tc64LL5hfOczqnS6Pkk-nUrRgHw5si6NIzZs65uwfdUJmXm1CM74_CxfMvLHBRU1cBnptTcrARbhR</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="669.368">H2A8_ErniCAXlOlVlJdUOZZRyJSpa5OucCPv_2jQmZdyoA8q06QRZyuTBQ9q5Ysdjv16sIfPXlynnrS7</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="718.888">fE4YNiPPdj8yQI6DfNDdYmncD8zkw6tZnFT9WiPpMAN9EkxO6nCXNMr1EDweHRAS9H3Id4ve5ZMmS4B8</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="696.083">QGR1QPCsQfga4T3LQXvFQHudopQZrOeGfHs7E-sSha1l6nl0bT7ASLN28EMO5dPZZQqRekTJqzN6jTIu</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="712.756">EESGFHqCjxPrBhJQwN029NCC97lcXdYi5o74Dn96eszU12wm2Kc6yK8Lk87AMVmkK1Rr_EV1wAsGF6YZ</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="641.901">len6NLI7nr4pLtieiekjA9WJMZLlpipTCwwZrRKfk0q8ESwdhy-i5JjLlU0wiljK-9CBUg6z94wXBuAO</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="710.739">vCPvlMROVQsIsVsTPgP4U6svyM5RLWWfdE3usA0QgxpLy8Cs3QtKE-HggVhQYibd9meFuKyTcDMbS7Yh</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="669.279">J4YlZr2lZgF02CEPrtqqE4JCKGBcskW6107zB7LHTqNzhhbfcbZBfgJUPj4OqZYx1fpCEfwsoqVZeoYw</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="710.104">lQYmzxv4N5eB0wdR-Ppv2nSF_3Jsiurwu0O7oCkkzhDUQuROWRYVOyDh2squ3CQZp-Fn4FTEyW