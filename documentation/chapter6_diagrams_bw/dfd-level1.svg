<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:621px;background:#FFFFFF;" width="790px" height="621px" viewBox="0 0 790 621" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9beta4?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="580.391" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="556.247">http://www.plantuml.com/plantuml/png/fLPBR-Cs4BxhLmnyI7THvE5NOY_QOc...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="576.885">http://www.plantuml.com/plantuml/png/~1fLPBR-Cs4BxhLmnyI7THvE5NOY_QOc...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="696.049">fLPBR-Cs4BxhLmnyI7THvE5NOY_QOcbPTfIrPKEI4spXYoBHDh4obQNaPDEY_xr3KhAeE8SMcuD3pNpp</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="714.13">u3SFwNDUHA8ux5Fh5_Zz9_xG77po9RWb0PauS0xZoHXcphqpWpPyc9ExXGzBVs4xGU047r4_EdlusP0x</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="705.51">bb28cOXJQkNV67-AHBI7VSQpU2UoFOL274nDlekIx8NnBMoYD3SrXvp6KKxXRmjW5CNVfY8xyCJEqap0</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="696.097">muuLLCepaL2XPQCKGIYRPBm8s5yKsXth7pDIaObeM_lR_YT_feSeHXV_szxIPYtR3Tq_7GykOHKuVWkY</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="675.712">N1qgjJDt_AdZsL_1TuBbmXkNcEDJ1IJZkUkvGUYJSA4XIbAfWta0Kn8w3-IhKk9p7OAuCrdnUxVohaIM</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="702.181">LN7J6hUDxCOZGz41rxFHpWkLqcqekr2dRo-yaDWQPJTGFNaPU-L0w92vqeSDVHz84BXJRru58GtrDKo8</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="720.569">xSxSK5ziqb3UWBS8tObhaz1TU0hWDG03M7bg37ndkV2r_vNVW0nDNLFLlj8imsmnhJWVMLRLewtsnTMQ</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="663.694">arLu2sThZWnFt9cZSCjs3Uf8KCNYci-9HwREyRBBJetiIkIHqZKlEGqqi5i3Un8ewGpWh6Jl73sZpnBR</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="663.346">gx5zYIqfT9rWpS_0SuW_qdGk-pNoMY8hFj6VfBJqTrsZRjITNV3Tu0iUv189wjlSrC2119Ri4zyXQwvv</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="693.144">TZtDvN9GOuVAgQ9wJ89R33vQ47-CjzCsPHf3W_ehpVtO3O_LMRQlBDnav_fFhX81cpHxoIkH9RiS7_v0</text><text x="17" y="447.417" fill="#000" font-size="14" textLength="684.387">A7o2bg1RbXU8keGqspAE_vz4jc4fRLc8-4qYvJmeCtmgpUuUGXDfUEr8TIneL5085e7qYm7WSir